<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account | Arunai Sacred Soils</title>
<meta name="description" content="Arunai Sacred Soils: fresh farm products, natural oils, honey, eggs, grains and millets delivered with care.">
<link rel="icon" type="image/svg+xml" href="../assets/icons/leaf.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="announce"></div><header id="site-header"></header>
<main class="auth-wrap"><div class="auth-card">
  <img class="logo" src="../assets/images/logo.jpg" alt="Arunai Sacred Soils">
  <h1>Create your account</h1><p class="sub">Shop faster and track every order.</p>
  <div id="form-alert" class="alert hidden" role="alert"></div>
  <form id="register-form" novalidate>
    <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name"></div>
    <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email"></div>
    <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit mobile number"></div>
    <div class="field"><label for="password">Password</label><div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="new-password"><button type="button" data-toggle-pw>Show</button></div><div class="meter" id="meter"><span></span></div><div class="hint" id="pw-hint">Use 8+ characters with upper and lower case, a number and a symbol.</div></div>
    <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"></div>
    <button class="btn btn-block" type="submit">Create account</button>
  </form>
  <p class="alt">Already registered? <a href="login.html">Log in</a></p>
</div></main>
<footer id="site-footer"></footer>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body></html>
